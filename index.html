<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>AI聊天助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#ededed;--card-bg:#fff;--text:#333;--text2:#999;--border:#e0e0e0;--input-bg:#fff;--input-border:#ddd;--bubble-other:#fff;--bubble-mine:#95ec69;--overlay-bg:rgba(0,0,0,.3)}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card-bg:#1c1c1e;--text:#e5e5e7;--text2:#8e8e93;--border:#2c2c2e;--input-bg:#2c2c2e;--input-border:#3a3a3c;--bubble-other:#3a3a3c;--bubble-mine:#2d6a4f;--overlay-bg:rgba(0,0,0,.7)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
.chat-body{display:flex;flex-direction:column;height:100%}
.header{background:#07c160;color:#fff;padding:10px 15px;display:flex;align-items:center;min-height:44px}
.header .title{font-size:16px;margin-left:8px;flex:1}
.header button{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:4px;font-size:13px;color:#fff;cursor:pointer;border:none;margin-left:6px}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 12px;background:var(--bg)}
.msg{margin-bottom:12px;display:flex;flex-direction:column}
.msg.mine{align-items:flex-end}.msg.other{align-items:flex-start}
.msg-sender{font-size:11px;color:var(--text2);margin-bottom:2px}
.msg-row{display:flex;align-items:flex-start;gap:8px;max-width:85%}
.msg.mine .msg-row{flex-direction:row-reverse}
.msg-avatar{flex-shrink:0;width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#07c160;color:#fff}
.bubble{padding:9px 13px;border-radius:8px;font-size:15px;word-break:break-word;line-height:1.5;max-width:100%}
.msg.mine .bubble{background:var(--bubble-mine)}.msg.other .bubble{background:var(--bubble-other)}
.bubble pre{background:#2d2d2d;color:#f8f8f2;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;margin:6px 0}
.bubble pre code{background:none;padding:0}
.bubble code{background:rgba(0,0,0,.1);padding:2px 6px;border-radius:3px;font-size:13px}
.bubble svg{max-width:100%;height:auto}
.audio-row{display:flex;align-items:center;gap:6px;margin:4px 0}
.voice-bubble{display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;min-width:100px;flex:1;border-radius:8px;background:var(--bubble-other)}
.voice-icon{font-size:20px}
.voice-bar{flex:1;height:3px;background:var(--text2);border-radius:2px;overflow:hidden;min-width:40px}
.voice-bar-inner{height:100%;background:#07c160;border-radius:2px;width:0;transition:width .1s linear}
.voice-duration{font-size:12px;color:var(--text2);min-width:40px}
.loop-btn{width:32px;height:32px;border-radius:50%;border:2px solid #ccc;background:var(--card-bg);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.loop-btn.active{border-color:#07c160;background:#e8f5e9;color:#07c160}
.chat-input-area{background:var(--card-bg);border-top:1px solid var(--border);padding:8px 10px}
.chat-input-row{display:flex;gap:6px}
.chat-input-row input{flex:1;padding:10px 12px;border:1px solid var(--input-border);border-radius:20px;font-size:15px;outline:none;background:var(--input-bg);color:var(--text)}
.chat-input-row input:focus{border-color:#07c160}
.chat-input-row .btn{padding:8px 16px;background:#07c160;color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer}
.think-outer{margin-bottom:6px;font-size:13px;color:var(--text2)}
.think-toggle{color:#07c160;cursor:pointer}
.think-content{display:none;background:var(--card-bg);border-radius:8px;padding:10px;color:var(--text2);white-space:pre-wrap;font-size:12px;overflow-x:auto}
.think-content.show{display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;display:none;max-width:80%;text-align:center}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:var(--overlay-bg)}
.cfg-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95%;max-width:500px;max-height:85vh;overflow-y:auto;z-index:101;background:var(--card-bg);border-radius:12px;padding:16px}
.cfg-panel h3{margin-bottom:10px}
.cfg-panel label{display:block;font-size:12px;color:var(--text2);margin:8px 0 2px}
.cfg-panel input,.cfg-panel textarea{width:100%;padding:8px;border:1px solid var(--input-border);border-radius:6px;font-size:13px;margin-bottom:4px;background:var(--input-bg);color:var(--text);font-family:inherit}
.cfg-panel textarea{min-height:100px;resize:vertical}
.cfg-hint{font-size:11px;color:var(--text2);margin-bottom:8px}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.btn-save{background:#07c160;color:#fff}
.btn-cancel{background:#999;color:#fff}
.btn-clear2{background:#e74c3c;color:#fff;width:100%;margin-top:8px;padding:8px;border:none;border-radius:8px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="chat-body">
<div class="header"><span>🤖</span><span class="title" id="headerName">AI助手</span><button id="btnSettings">⚙️</button><button id="btnClear">🗑️</button></div>
<div class="chat-msgs" id="aiMsgs"><div class="msg other"><div class="msg-sender">AI助手</div><div class="msg-row"><div class="msg-avatar">🤖</div><div class="bubble">你好！<br>🎨 画一个爱心<br>🎵 用钢琴弹一首小星星<br>🥁 来一段低频震撼的鼓点</div></div></div></div>
<div class="chat-input-area"><div class="chat-input-row"><input type="text" id="aiInput" placeholder="输入问题..." autocomplete="off"><button class="btn" id="btnSend">发送</button></div></div>
</div>
<div class="overlay" id="cfgOverlay"></div>
<div class="cfg-panel" id="cfgPanel">
<h3>⚙️设置</h3><label>AI名称</label><input id="cfgName"><label>提示词</label><textarea id="cfgPrompt"></textarea><div class="cfg-hint">规则自动追加</div>
<label>API URL 1</label><input id="pu0"><label>Key 1</label><input type="password" id="pk0"><label>Model 1</label><input id="pm0">
<label>API URL 2</label><input id="pu1"><label>Key 2</label><input type="password" id="pk1"><label>Model 2</label><input id="pm1">
<label>API URL 3</label><input id="pu2"><label>Key 3</label><input type="password" id="pk2"><label>Model 3</label><input id="pm2">
<div class="btn-row"><button class="btn-save" id="btnSaveCfg">保存</button><button class="btn-cancel" id="btnCancelCfg">取消</button></div>
<button class="btn-clear2" id="btnClearChat2">清空对话</button>
</div>

<script>
// ==========================================
//  物理建模引擎 v6.0 - 全面真实化（修复播放）
//  纯代码：力度分层 + 泛音列变化 + 踏板共鸣 + 房间混响 + 鼓组高频
// ==========================================

// ========== AudioContext 恢复 ==========
document.addEventListener('click', function() {
    if (window._globalCtx && window._globalCtx.state === 'suspended') {
        window._globalCtx.resume();
    }
}, {passive: true});

// ========== 全局混响（纯代码脉冲响应） ==========
var _reverbCache = null;
function getReverb(ctx) {
    if (_reverbCache && _reverbCache.sampleRate === ctx.sampleRate) {
        var c = ctx.createConvolver();
        c.buffer = _reverbCache;
        return c;
    }
    var dur = 2.5, len = Math.floor(ctx.sampleRate * dur);
    var imp = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
        var d = imp.getChannelData(ch);
        for (var i = 0; i < len; i++) {
            var t = i / ctx.sampleRate;
            var val = 0;
            var reflections = [0.03, 0.06, 0.09, 0.13, 0.17, 0.22];
            var amps = [0.5, 0.35, 0.25, 0.18, 0.12, 0.08];
            for (var j = 0; j < reflections.length; j++) {
                if (Math.abs(t - reflections[j]) < 0.004) val = amps[j] * (Math.random() * 0.5 + 0.5);
            }
            var decay = Math.exp(-t * 2.8);
            var hfDamp = Math.exp(-t * 5);
            val += (Math.random() * 2 - 1) * decay * (0.12 + hfDamp * 0.08);
            d[i] = val * 0.5;
        }
    }
    _reverbCache = imp;
    var c = ctx.createConvolver();
    c.buffer = imp;
    return c;
}

// ========== 音高→泛音列（低音泛音丰富，高音更纯净） ==========
function getOvertoneProfile(midiNote) {
    var n = midiNote || 60;
    var bassFactor = Math.max(0, 1 - (n - 20) / 60);
    return {
        h1: 1.0,
        h2: 0.55 + bassFactor * 0.3,
        h3: 0.25 + bassFactor * 0.3,
        h4: 0.12 + bassFactor * 0.2,
        h5: 0.06 + bassFactor * 0.15,
        h6: 0.03 + bassFactor * 0.1,
        bassBoost: bassFactor * 0.3
    };
}

// ========== 力度→动态参数 ==========
function getVelocityDynamics(vel) {
    var v = Math.max(0.05, Math.min(1.5, vel));
    return {
        attackStrength: 0.3 + v * 0.7,
        bodyResonance: 0.3 + v * 0.7,
        brightness: 0.4 + v * 0.6,
        decayTime: 0.4 + (1.5 - v) * 0.6,
        harmonicRichness: 0.25 + v * 0.75
    };
}

// ========== 乐器库（保持不变，只升级引擎） ==========
var INS = {
    'piano':{engine:'hammer',wave:'triangle',filter:2500},
    'bright_piano':{engine:'hammer',wave:'triangle',filter:4000},
    'honky_tonk':{engine:'hammer',wave:'triangle',filter:1500},
    'electric_piano':{engine:'hammer',wave:'triangle',filter:3000},
    'harpsichord':{engine:'pluck',wave:'triangle',decay:1.2,filter:3000},
    'violin':{engine:'bowed',wave:'sawtooth',vibrato:5,depth:4,bowNoise:0.08,attack:0.2,filter:2800},
    'viola':{engine:'bowed',wave:'sawtooth',vibrato:4,depth:5,bowNoise:0.1,attack:0.25,filter:2200},
    'cello':{engine:'bowed',wave:'sawtooth',vibrato:3.5,depth:6,bowNoise:0.12,attack:0.3,filter:1600},
    'contrabass':{engine:'bowed',wave:'sawtooth',vibrato:2.5,depth:8,bowNoise:0.15,attack:0.35,filter:800},
    'strings':{engine:'bowed',wave:'sawtooth',vibrato:3,depth:3,bowNoise:0.05,attack:0.3,filter:3000},
    'pizzicato':{engine:'pluck',wave:'triangle',decay:0.6,filter:2500},
    'harp':{engine:'pluck',wave:'triangle',decay:2,filter:3500},
    'trumpet':{engine:'brass',wave:'sawtooth',brightness:0.9,attack:0.03,filter:3500},
    'trombone':{engine:'brass',wave:'sawtooth',brightness:0.7,attack:0.05,filter:2500},
    'tuba':{engine:'brass',wave:'sawtooth',brightness:0.5,attack:0.08,filter:1200},
    'french_horn':{engine:'brass',wave:'sawtooth',brightness:0.6,attack:0.04,filter:2000},
    'brass':{engine:'brass',wave:'sawtooth',brightness:0.8,attack:0.03,filter:3000},
    'flute':{engine:'wind',wave:'sine',breathNoise:0.03,attack:0.06,filter:5000},
    'piccolo':{engine:'wind',wave:'sine',breathNoise:0.04,attack:0.04,filter:8000},
    'clarinet':{engine:'wind',wave:'square',breathNoise:0.06,attack:0.05,filter:3000},
    'oboe':{engine:'wind',wave:'sawtooth',breathNoise:0.08,attack:0.04,filter:3500},
    'bassoon':{engine:'wind',wave:'sawtooth',breathNoise:0.07,attack:0.06,filter:1800},
    'sax':{engine:'reed',wave:'sawtooth',breathNoise:0.08,reediness:0.6,attack:0.04,filter:2500},
    'alto_sax':{engine:'reed',wave:'sawtooth',breathNoise:0.07,reediness:0.55,attack:0.04,filter:2800},
    'tenor_sax':{engine:'reed',wave:'sawtooth',breathNoise:0.09,reediness:0.65,attack:0.05,filter:2200},
    'guitar':{engine:'pluck',wave:'triangle',decay:1.5,filter:2000},
    'nylon_guitar':{engine:'pluck',wave:'triangle',decay:2,filter:2500},
    'electric_guitar':{engine:'pluck',wave:'sawtooth',decay:1.2,filter:2500},
    'overdrive_guitar':{engine:'pluck',wave:'square',decay:1,filter:2000},
    'distortion_guitar':{engine:'pluck',wave:'square',decay:0.8,filter:1500},
    'bass':{engine:'pluck',wave:'sawtooth',decay:0.6,filter:350},
    'acoustic_bass':{engine:'pluck',wave:'triangle',decay:0.8,filter:400},
    'slap_bass':{engine:'pluck',wave:'sawtooth',decay:0.3,filter:600},
    'synth_bass':{engine:'pluck',wave:'square',decay:0.4,filter:250},
    'organ':{engine:'additive',harmonics:[1,0.5,0.3,0.15,0.08,0.04,0.02],attack:0.02,release:0.1},
    'church_organ':{engine:'additive',harmonics:[1,0.7,0.5,0.3,0.2,0.1,0.05,0.03],attack:0.05,release:0.3},
    'accordion':{engine:'additive',harmonics:[1,0.6,0.3,0.2,0.1],attack:0.03,release:0.15},
    'bell':{engine:'bell',wave:'sine',decay:2.5,modFreq:1.07},
    'music_box':{engine:'bell',wave:'sine',decay:1.8,modFreq:1.03},
    'xylophone':{engine:'bell',wave:'triangle',decay:1.2,modFreq:1.01},
    'glockenspiel':{engine:'bell',wave:'sine',decay:2,modFreq:1.05},
    'vibraphone':{engine:'bell',wave:'triangle',decay:3,modFreq:1.02},
    'celesta':{engine:'bell',wave:'sine',decay:1.5,modFreq:1.04},
    'marimba':{engine:'bell',wave:'triangle',decay:1.4,modFreq:1.01},
    'drum':{engine:'perc',percType:'kick'},
    'kick':{engine:'perc',percType:'kick'},
    'snare':{engine:'perc',percType:'snare'},
    'hihat':{engine:'perc',percType:'hihat'},
    'clap':{engine:'perc',percType:'clap'},
    'ride':{engine:'perc',percType:'ride'},
    'crash':{engine:'perc',percType:'crash'},
    'tom':{engine:'perc',percType:'tom'},
    'cowbell':{engine:'perc',percType:'cowbell'},
    'tambourine':{engine:'perc',percType:'tambourine'},
    'shaker':{engine:'perc',percType:'shaker'},
    'woodblock':{engine:'perc',percType:'woodblock'},
    'timpani':{engine:'perc',percType:'timpani'},
    'synth_lead':{engine:'hammer',wave:'sawtooth',filter:5000},
    'pad':{engine:'bowed',wave:'sine',vibrato:2,depth:1,bowNoise:0.02,attack:0.5,filter:3000},
    'default':{engine:'hammer',wave:'triangle',filter:2500}
};

// ========== 音符解析 ==========
function n2m(n){if(!n||n==='R')return -1;var m=n.match(/^([A-GR])([#b]?)(\d)$/i);if(!m||m[1].toUpperCase()==='R')return -1;var nm={C:0,D:2,E:4,F:5,G:7,A:9,B:11};var b=nm[m[1].toUpperCase()]||0;if(m[2]==='#')b+=1;if(m[2]==='b')b-=1;return(parseInt(m[3])+1)*12+b}
function m2f(m){return 440*Math.pow(2,(m-69)/12)}
var CHORDS_MIDI={C:[60,64,67],Cm:[60,63,67],D:[62,66,69],Dm:[62,65,69],E:[64,68,71],Em:[64,67,71],F:[65,69,72],Fm:[65,68,72],G:[67,71,74],Gm:[67,70,74],A:[69,73,76],Am:[69,72,76]};

function parseMIDI(code){
    var lines=code.trim().split('\n'),tracks=[],ct=null,ci='piano',bpm=120;
    for(var i=0;i<lines.length;i++){
        var line=lines[i].trim();if(!line||line.startsWith('//'))continue;
        var tm=line.match(/^!track\s+(\w+)/i);if(tm&&INS[tm[1]]){if(ct)tracks.push(ct);ci=tm[1];ct={inst:ci,notes:[],tt:0};continue}
        var bm=line.match(/^!bpm\s+(\d+)/i);if(bm){bpm=parseInt(bm[1]);continue}
        var cm=line.match(/^!chord\s+(\w+)\s+([\d.]+)?/i);if(cm&&CHORDS_MIDI[cm[1]]){if(!ct)ct={inst:ci,notes:[],tt:0};var dur=parseFloat(cm[2])||1;CHORDS_MIDI[cm[1]].forEach(function(m){ct.notes.push({midi:m,time:ct.tt,duration:dur})});ct.tt+=dur;continue}
        if(!ct)ct={inst:ci,notes:[],tt:0};
        var parts=line.split(/\s+/);if(parts.length>=2){var dur=parseFloat(parts[1])||0.5;var vel=1;if(parts.length>=3){if(parts[2]==='loud')vel=1.4;else if(parts[2]==='soft')vel=0.4}else{vel=0.7+Math.random()*0.6}parts[0].split('+').forEach(function(n){var m=n2m(n.trim());if(m>=0)ct.notes.push({midi:m,time:ct.tt,duration:dur,velocity:vel})});ct.tt+=dur}
    }if(ct)tracks.push(ct);
    tracks.forEach(function(t){t.notes.forEach(function(n){n.freq=n.midi>=0?m2f(n.midi):0})});
    return{tracks:tracks,bpm:bpm};
}

// ========== 物理建模播放引擎 v6.0（修复版） ==========
function playNote(ctx,freq,start,dur,cfg,midiNote,velocity){
    try {
        // 创建主增益节点
        var mg=ctx.createGain();
        mg.gain.value=0.18;
        
        // 创建干湿声混合
        var dryG=ctx.createGain();
        dryG.gain.value=0.7;
        dryG.connect(ctx.destination);
        
        var wetG=ctx.createGain();
        wetG.gain.value=0.3;
        
        // 安全创建混响
        try {
            var rev=getReverb(ctx);
            mg.connect(dryG);
            mg.connect(rev);
            rev.connect(wetG);
            wetG.connect(ctx.destination);
        } catch(e) {
            // 如果混响失败，直接输出干声
            mg.connect(dryG);
        }
        
        var vel=velocity||1;
        var dyn=getVelocityDynamics(vel);
        var ov=getOvertoneProfile(midiNote||60);
        var eng=(cfg||INS['default']).engine||'hammer';
        
        if(eng==='hammer'){
            // 力度分层锤击
            var hammer=ctx.createOscillator();hammer.type='square';hammer.frequency.value=freq*2.5;
            var hG=ctx.createGain();hG.gain.setValueAtTime(0,start);hG.gain.linearRampToValueAtTime(dyn.attackStrength*0.5,start+0.003);hG.gain.exponentialRampToValueAtTime(0.001,start+0.05);
            hammer.connect(hG);hG.connect(mg);hammer.start(start);hammer.stop(start+0.05);
            // 泛音列
            var harmonics=[1,0.55,0.25,0.12,0.06,0.03];
            var hRichness=dyn.harmonicRichness;
            for(var h=1;h<=6;h++){
                var hv=harmonics[h-1]*hRichness*ov['h'+(h+1)]*0.6;if(hv<0.01)continue;
                var ho=ctx.createOscillator();ho.type='sine';ho.frequency.value=freq*(h+1);
                var hg=ctx.createGain();hg.gain.setValueAtTime(0,start);hg.gain.linearRampToValueAtTime(hv*dyn.bodyResonance,start+0.005);hg.gain.exponentialRampToValueAtTime(0.001,start+dur*dyn.decayTime*(1-h*0.15));
                ho.connect(hg);hg.connect(mg);ho.start(start);ho.stop(start+dur*dyn.decayTime+0.1);
            }
            // 主音色
            var body=ctx.createOscillator();body.type=cfg.wave||'triangle';body.frequency.value=freq;
            var bF=ctx.createBiquadFilter();bF.type='lowpass';bF.frequency.value=(cfg.filter||2500)*dyn.brightness;
            var bG=ctx.createGain();bG.gain.setValueAtTime(0,start);bG.gain.linearRampToValueAtTime(dyn.bodyResonance*0.7,start+0.005);bG.gain.exponentialRampToValueAtTime(0.001,start+dur*dyn.decayTime);
            body.connect(bF);bF.connect(bG);bG.connect(mg);body.start(start);body.stop(start+dur*dyn.decayTime+0.1);
            // 踏板共鸣
            if(ov.bassBoost>0.05){var reso=ctx.createOscillator();reso.type='sine';reso.frequency.value=freq*0.5;var rG=ctx.createGain();rG.gain.setValueAtTime(0,start);rG.gain.linearRampToValueAtTime(ov.bassBoost*0.15,start+0.1);rG.gain.exponentialRampToValueAtTime(0.001,start+dur*1.5);reso.connect(rG);rG.connect(mg);reso.start(start);reso.stop(start+dur*1.5+0.5)}
        }else if(eng==='bowed'){
            var osc=ctx.createOscillator();osc.type=cfg.wave||'sawtooth';osc.frequency.value=freq;
            var vib=ctx.createOscillator();vib.frequency.value=(cfg.vibrato||5)+vel*2;
            var vibG=ctx.createGain();vibG.gain.value=(cfg.depth||4)*vel;vib.connect(vibG);vibG.connect(osc.frequency);vib.start(start);vib.stop(start+dur);
            if(cfg.bowNoise>0){var bowN=ctx.createOscillator();bowN.type='sawtooth';bowN.frequency.value=freq*0.5;var bowG=ctx.createGain();bowG.gain.setValueAtTime(cfg.bowNoise*vel,start);bowG.gain.exponentialRampToValueAtTime(0.001,start+dur);bowN.connect(bowG);bowG.connect(mg);bowN.start(start);bowN.stop(start+dur)}

function playMIDIBlock(tracks,bpm,ctx,st){
    var bd=60/(bpm||120);
    tracks.forEach(function(track){
        track.notes.forEach(function(n){
            if(n.freq<=0)return;
            var cfg=INS[track.inst]||INS['default'];
            playNote(ctx,n.freq,st+n.time*bd,n.duration*bd,cfg,n.midi,n.velocity||1);
        });
    });
}

var box=document.getElementById('aiMsgs');
window._midi={};window._loops={};

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},2000)}
function sm(){localStorage.setItem('ai_msgs',JSON.stringify(msgs))}
function uh(){document.getElementById('headerName').textContent=cfg.name}
function rel(el){el.querySelector('.voice-bar-inner').style.width='0%';el.querySelector('.voice-icon').textContent='🔊';if(el._pi){clearInterval(el._pi);el._pi=null}}

function ra(){box.innerHTML='';if(msgs.length===0){box.innerHTML='<div class="msg other"><div class="msg-sender">'+esc(cfg.name)+'</div><div class="msg-row"><div class="msg-avatar">🤖</div><div class="bubble">你好！</div></div></div>';return}msgs.forEach(function(m){rm(m)});box.scrollTop=box.scrollHeight}
function rm(m){var d=document.createElement('div');d.className='msg '+(m.role==='user'?'mine':'other');
    if(m.role==='user'){d.innerHTML='<div class="msg-row"><div class="msg-avatar">👤</div><div class="bubble">'+esc(m.content)+'</div></div>'}
    else{var th='';if(m.thinking)th='<div class="think-outer"><span class="think-toggle" onclick="this.nextElementSibling.classList.toggle(\'show\')">展开</span><div class="think-content">'+esc(m.thinking)+'</div></div>';
        var raw=m.content||'';var ar=ea(raw);raw=ar.html;var h=marked.parse(raw);
        h=h.replace(/【photo】\s*([\s\S]*?)\s*【\/photo】/gi,function(_,c){return parsePhoto(c)});
        ar.blocks.forEach(function(b){window._midi[b.id]=b.data;window._loops[b.id]=false;
            var oh='<div class="voice-bubble" data-midi="'+b.id+'"><span class="voice-icon">🔊</span><div class="voice-bar"><div class="voice-bar-inner" style="width:0%"></div></div><span class="voice-duration">'+b.label+'</span></div>';
            var nh='<div class="audio-row"><div class="voice-bubble" data-midi="'+b.id+'" onclick="playMidi(this)"><span class="voice-icon">🔊</span><div class="voice-bar"><div class="voice-bar-inner" style="width:0%"></div></div><span class="voice-duration">'+b.label+'</span></div><button class="loop-btn" onclick="event.stopPropagation();toggleLoop(\''+b.id+'\',this)" title="循环">🔁</button></div>';
            h=h.replace(oh,nh);});
        d.innerHTML='<div class="msg-sender">'+esc(cfg.name)+'</div><div class="msg-row"><div class="msg-avatar">🤖</div><div style="min-width:0;flex:1">'+th+'<div class="bubble">'+h+'</div></div></div>';}box.appendChild(d);}

function ea(content){var blocks=[];content=content.replace(/```audio\n?([\s\S]*?)```/gi,function(_,code){var id='midi_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);var data=parseMIDI(code);var mt=0;data.tracks.forEach(function(t){t.notes.forEach(function(n){var e=(n.time+n.duration)*(60/data.bpm);if(e>mt)mt=e})});var tl=Math.ceil(mt);var label=tl>=60?Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0'):tl+'s';blocks.push({id:id,data:data,label:label});return'<div class="voice-bubble" data-midi="'+id+'"><span class="voice-icon">🔊</span><div class="voice-bar"><div class="voice-bar-inner" style="width:0%"></div></div><span class="voice-duration">'+label+'</span></div>';});return{html:content,blocks:blocks};}
function toggleLoop(aid,btn){window._loops[aid]=!window._loops[aid];btn.classList.toggle('active',window._loops[aid])}
function playMidi(el){var id=el.getAttribute('data-midi'),data=window._midi[id];if(!data||!data.tracks)return;if(el._c){el._c.close();el._c=null;if(el._lt)clearTimeout(el._lt);rel(el);return}var looping=window._loops[id]||false;try{var ctx=new(window.AudioContext||window.webkitAudioContext)();window._globalCtx=ctx;el._c=ctx;var now=ctx.currentTime;playMIDIBlock(data.tracks,data.bpm,ctx,now);var bd=60/(data.bpm||120);var totalDur=0;data.tracks.forEach(function(t){t.notes.forEach(function(n){var e=(n.time+n.duration)*bd+0.5;if(e>totalDur)totalDur=e})});el.querySelector('.voice-icon').textContent='⏸';var bar=el.querySelector('.voice-bar-inner');var startTime=Date.now();var totalMs=totalDur*1000;el._pi=setInterval(function(){var elapsed=Date.now()-startTime;var pct=Math.min(100,Math.round(elapsed/totalMs*100));bar.style.width=pct+'%';if(pct>=100||!el._c){clearInterval(el._pi);el._pi=null}},100);if(looping){function sl(){if(!el._c)return;now=ctx.currentTime;playMIDIBlock(data.tracks,data.bpm,ctx,now);startTime=Date.now();totalMs=totalDur*1000;bar.style.width='0%';el._pi=setInterval(function(){var elapsed=Date.now()-startTime;var pct=Math.min(100,Math.round(elapsed/totalMs*100));bar.style.width=pct+'%';if(pct>=100||!el._c){clearInterval(el._pi);el._pi=null}},100);el._lt=setTimeout(sl,totalMs)}el._lt=setTimeout(sl,totalMs)}else{setTimeout(function(){if(el._c){el._c.close();el._c=null;rel(el)}},totalMs+500)}}catch(e){console.error(e)}}

async function sendMsg(){var inp=document.getElementById('aiInput'),txt=inp.value.trim();if(!txt)return;var ud=document.createElement('div');ud.className='msg mine';ud.innerHTML='<div class="msg-row"><div class="msg-avatar">👤</div><div class="bubble">'+esc(txt)+'</div></div>';box.appendChild(ud);var ld=document.createElement('div');ld.className='msg other';ld.id='al';ld.innerHTML='<div class="msg-sender">'+esc(cfg.name)+'</div><div class="msg-row"><div class="msg-avatar">🤖</div><div class="bubble">思考中...</div></div>';box.appendChild(ld);box.scrollTop=box.scrollHeight;inp.value='';msgs.push({role:'user',content:txt});sm();var ap=cfg.providers.filter(function(p){return p.url&&p.key&&p.model});if(ap.length===0){document.getElementById('al')?.remove();toast('请先配置API');return}var result=null;for(var j=0;j<ap.length;j++){var pr=ap[j];try{var ms=[{role:'system',content:cfg.prompt}];msgs.forEach(function(m){ms.push({role:m.role,content:m.content})});var resp=await fetch(pr.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+pr.key},body:JSON.stringify({model:pr.model,messages:ms,temperature:0.6,max_tokens:4096})});var data=await resp.json();if(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content){result={content:data.choices[0].message.content,thinking:data.choices[0].message.reasoning_content||''};break}}catch(e){}}document.getElementById('al')?.remove();if(result){var th='';if(result.thinking)th='<div class="think-outer"><span class="think-toggle" onclick="this.nextElementSibling.classList.toggle(\'show\')">展开</span><div class="think-content">'+esc(result.thinking)+'</div></div>';var raw=result.content;var ar=ea(raw);raw=ar.html;var h=marked.parse(raw);h=h.replace(/【photo】\s*([\s\S]*?)\s*【\/photo】/gi,function(_,c){return parsePhoto(c)});ar.blocks.forEach(function(b){window._midi[b.id]=b.data;window._loops[b.id]=false;var oh='<div class="voice-bubble" data-midi="'+b.id+'"><span class="voice-icon">🔊</span><div class="voice-bar"><div class="voice-bar-inner" style="width:0%"></div></div><span class="voice-duration">'+b.label+'</span></div>';var nh='<div class="audio-row"><div class="voice-bubble" data-midi="'+b.id+'" onclick="playMidi(this)"><span class="voice-icon">🔊</span><div class="voice-bar"><div class="voice-bar-inner" style="width:0%"></div></div><span class="voice-duration">'+b.label+'</span></div><button class="loop-btn" onclick="event.stopPropagation();toggleLoop(\''+b.id+'\',this)" title="循环">🔁</button></div>';h=h.replace(oh,nh);});var ad=document.createElement('div');ad.className='msg other';ad.innerHTML='<div class="msg-sender">'+esc(cfg.name)+'</div><div class="msg-row"><div class="msg-avatar">🤖</div><div style="min-width:0;flex:1">'+th+'<div class="bubble">'+h+'</div></div></div>';box.appendChild(ad);box.scrollTop=box.scrollHeight;msgs.push({role:'assistant',content:result.content,thinking:result.thinking});sm();}else{var ed=document.createElement('div');ed.className='msg other';ed.innerHTML='<div class="msg-sender">'+esc(cfg.name)+'</div><div class="bubble">❌服务暂不可用</div></div>';box.appendChild(ed)}}

function sc(){document.getElementById('cfgName').value=cfg.name;document.getElementById('cfgPrompt').value=cfg.prompt.replace(AUTO_RULES,'').trim();for(var i=0;i<3;i++){var p=cfg.providers[i]||{url:'',key:'',model:''};document.getElementById('pu'+i).value=p.url;document.getElementById('pk'+i).value=p.key;document.getElementById('pm'+i).value=p.model}document.getElementById('cfgOverlay').style.display='block';document.getElementById('cfgPanel').style.display='block'}
function hc(){document.getElementById('cfgOverlay').style.display='none';document.getElementById('cfgPanel').style.display='none'}
function sv(){cfg.name=document.getElementById('cfgName').value.trim()||'AI助手';cfg.prompt=(document.getElementById('cfgPrompt').value.trim()||'你是AI助手。')+AUTO_RULES;for(var i=0;i<3;i++){cfg.providers[i]={url:document.getElementById('pu'+i).value.trim(),key:document.getElementById('pk'+i).value.trim(),model:document.getElementById('pm'+i).value.trim()}}localStorage.setItem('ai_cfg',JSON.stringify(cfg));hc();uh();toast('已保存')}
function cc(){msgs=[];sm();ra();hc();toast('已清空')}

document.getElementById('btnSettings').onclick=sc;document.getElementById('btnClear').onclick=cc;
document.getElementById('btnSend').onclick=sendMsg;document.getElementById('btnSaveCfg').onclick=sv;
document.getElementById('btnCancelCfg').onclick=hc;document.getElementById('btnClearChat2').onclick=cc;
document.getElementById('cfgOverlay').onclick=hc;
document.getElementById('aiInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
uh();ra();
</script>
</body>
</html>
